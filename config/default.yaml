# StreamPulse-Edge production config: two REAL industrial video streams and
# the REAL quantized YOLO11n INT8 ONNX model stored under $MODEL_DIR.
# Run tools/download_assets.py then tools/quantize_yolo_int8.py first.

log_level: INFO

streams:
  - name: bottle-line
    source: rtsp://127.0.0.1:8554/bottle
    roi_line: [0.85, 0.0, 0.85, 1.0]   # vertical conveyor line, left -> right counted
    dwell_max_s: 8.0
    anomaly_classes: []
  - name: worker-zone
    source: rtsp://127.0.0.1:8554/worker
    roi_line: [0.60, 0.0, 0.60, 1.0]
    dwell_max_s: 10.0
    anomaly_classes: []
  # Stress-test cameras 3 and 4 are enabled by config/stress_4stream.yaml.
  - name: cam3
    enabled: false
    source: rtsp://127.0.0.1:8554/bottle
    roi_line: [0.45, 0.0, 0.45, 1.0]
    dwell_max_s: 8.0
    anomaly_classes: []
  - name: cam4
    enabled: false
    source: rtsp://127.0.0.1:8554/worker
    roi_line: [0.45, 0.0, 0.45, 1.0]
    dwell_max_s: 8.0
    anomaly_classes: []

detector:
  model_path: ${MODEL_DIR}/yolo11n_416_int8.onnx
  backend: onnxruntime
  input_size: 416
  conf_threshold: 0.25
  iou_threshold: 0.45
  max_detections: 32
  num_threads: 2

pipeline:
  ring_capacity: 3
  ingest_fps: 15
  inference_interval_s: 0.0
  frame_width: 640
  frame_height: 480
  tracker_max_age: 60
  tracker_iou_threshold: 0.25
  line_hysteresis_px: 6.0
  latency_window: 300

backpressure:
  cpu_high_pct: 95
  cpu_low_pct: 80
  rss_high_mb: 3072           # 3.0 GB soft limit, keeps peak strictly under 3.5 GB
  rss_critical_mb: 3379       # 3.3 GB hard limit (below the 3.5 GB requirement)
  ram_high_pct: 85
  max_skip_ratio: 7
  control_interval_s: 0.5
  recovery_interval_s: 2.0

web:
  enabled: true
  host: 0.0.0.0
  port: 8000
  mjpeg_fps: 12
