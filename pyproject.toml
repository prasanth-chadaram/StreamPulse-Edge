[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streampulse-edge"
version = "1.0.0"
description = "CPU-only multi-stream edge video analytics engine"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "opencv-python-headless>=4.8", "psutil>=5.9", "PyYAML>=6.0",
  "fastapi>=0.100", "uvicorn>=0.22", "websockets>=11.0"
]

[project.scripts]
streampulse = "streampulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
streampulse = ["web/*.html"]
